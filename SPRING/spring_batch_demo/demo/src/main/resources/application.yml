spring:
  application:
    name: spring-batch-demo

  # Spring Batch 설정 (운영 환경)
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  # JPA 공통 설정
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 다중 데이터소스 설정
datasource:
  # Primary: Batch 메타데이터 + Customer 테이블
  primary:
    jdbc-url: jdbc:mysql://localhost:3306/batch_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: batch_user
    password: batch_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Secondary: New Customer 테이블 (물리적으로 분리된 DB)
  secondary:
    jdbc-url: jdbc:mysql://localhost:3307/new_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: new_user
    password: new_password
    driver-class-name: com.mysql.cj.jdbc.Driver
